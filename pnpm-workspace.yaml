allowBuilds:
  '@intlify/vue-i18n-bridge': true
  '@intlify/vue-router-bridge': true
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: false
  vue-demi: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@nuxt/content@3.17.0'
  - '@nuxtjs/mdc@0.23.4'
  - isomorphic-git@1.44.16

overrides:
  sharp: $sharp

shellEmulator: true
