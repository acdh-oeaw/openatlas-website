description: 'The Frontier, Contact Zone or No Man''s Land project is an international Austrian-Czech research project sponsored by the Austrian Science Fund (FWF) and Grantová agentura České republiky (GA ČR). It focused on the Morawa-Thaya region as boarder region between nowadays Austria and Czechia in Medieval times. '
